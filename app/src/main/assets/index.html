<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101225"><title>Highway Rush 500</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111329;color:white;font-family:system-ui,sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;top:0;left:0;width:100%;padding:calc(env(safe-area-inset-top) + 18px) 20px 15px;background:linear-gradient(#101225eb,transparent);display:flex;justify-content:space-between;align-items:start;pointer-events:none}.brand{font-size:16px;font-weight:900;letter-spacing:1px}.tag{font-size:10px;letter-spacing:3px;color:#71e9ff;margin-top:5px}.numbers{text-align:right;font-size:12px;color:#d6d8e6}.numbers strong{font-size:23px;color:white}.controls{position:fixed;bottom:0;left:0;right:0;padding:12px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,#0a1020dc)}button{color:white;border:1px solid #ffffff40;background:#242d4cce;border-radius:22px;font:700 18px system-ui;touch-action:none;cursor:pointer}button:active{background:#71e9ff;color:#101225;transform:scale(.96)}.steer{width:26%;height:80px;font-size:30px;backdrop-filter:blur(8px)}.speed{text-align:center;font-size:38px;font-weight:900;line-height:1}.speed small{display:block;font-size:10px;letter-spacing:2px;color:#93eaff;margin-top:8px}.topActions{position:fixed;right:18px;top:calc(env(safe-area-inset-top) + 97px);display:flex;gap:8px}.topActions button{width:46px;height:42px;font-size:18px;border-radius:14px}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080b205b;backdrop-filter:blur(5px);padding:24px}.card{width:min(100%,370px);background:linear-gradient(150deg,#282e50f5,#11162af5);border:1px solid #ffffff25;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 70px #0006}.eyebrow{color:#77e9ff;font-size:11px;letter-spacing:3px;font-weight:800}h1{font-size:42px;line-height:1.05;margin:15px 0}p{color:#c5ccdf;font-size:15px;line-height:1.7}.primary{background:#76e8ff;color:#11192f;border:0;padding:18px;width:100%;margin-top:10px}.hint{font-size:11px;opacity:.7;margin-top:15px}.hidden{display:none!important}#toast{position:fixed;top:31%;width:100%;text-align:center;color:#88f4ff;font-size:24px;font-weight:900;pointer-events:none;text-shadow:0 2px 12px #000} @media(max-height:480px){.card{padding:15px}h1{font-size:28px;margin:8px}p{margin:8px}.steer{height:56px}.hud{padding-top:8px}.topActions{top:75px}}
</style></head><body>
<canvas id="road" aria-label="Highway racing game"></canvas>
<div class="hud"><div><div class="brand">HIGHWAY RUSH</div><div class="tag">500 • HARD MODE</div></div><div class="numbers">SCORE <strong id="score">0</strong><br>BEST <span id="best">0</span></div></div>
<div class="topActions"><button id="fullscreen" aria-label="Full screen">⛶</button><button id="pause" aria-label="Pause">Ⅱ</button></div>
<div id="toast"></div><div class="controls"><button class="steer" id="left" aria-label="Move left">←</button><div class="speed"><span id="speed">180</span><small>KM / H</small></div><button class="steer" id="right" aria-label="Move right">→</button></div>
<div class="overlay" id="overlay"><div class="card"><div class="eyebrow">SUNSET RUN / HARD</div><h1 id="title">HIGHWAY<br>RUSH 500</h1><p id="message">Traffic se bacho. Speed 180 se<br><b>500 km/h</b> tak barhti jayegi.<br>Ek takkar — race khatam!</p><button class="primary" id="start">Race shuru karo →</button><div class="hint">← → buttons ya swipe se lane badlo</div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('road'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,state='ready',lane=1,px=1,speed=180,score=0,best=0,elapsed=0,travel=0,traffic=[],spawn=0,last=0,toastTime=0,safeLane=1;
try{best=+localStorage.getItem('highway-rush-best')||0}catch(e){} $('best').textContent=best;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function roadPoint(l,z){const p=z*z;return {x:W/2+(l-1)*(W*.86/3)*p,y:H*.32+H*.59*p,s: .055+.945*p}}
function car(l,z,color,player=false){const q=roadPoint(l,z),w=W*.145*q.s,h=w*1.76,x=q.x-w/2,y=q.y-h;ctx.save();ctx.shadowBlur=player?22:0;ctx.shadowColor='#70ebff';rr(x-3*q.s,y+h*.24,w+6*q.s,h*.65,5*q.s,'#0b1020');rr(x,y,w,h,10*q.s,color);ctx.shadowBlur=0;rr(x+w*.12,y+h*.24,w*.76,h*.25,4*q.s,'#15253c');rr(x+w*.17,y+h*.57,w*.66,h*.14,3*q.s,'#16233c');rr(x+w*.15,y+h*.04,w*.7,h*.08,2*q.s,'#ffffff50');rr(x+w*.06,y+h*.88,w*.22,h*.055,2*q.s,'#ff667d');rr(x+w*.72,y+h*.88,w*.22,h*.055,2*q.s,'#ff667d');if(player){rr(x+w*.39,y+h*.02,w*.09,h*.19,0,'#fff9');rr(x+w*.53,y+h*.02,w*.09,h*.19,0,'#fff9')}ctx.restore()}
function render(){const horizon=H*.32,g=ctx.createLinearGradient(0,0,0,horizon);g.addColorStop(0,'#403b92');g.addColorStop(.7,'#ba729c');g.addColorStop(1,'#f5b184');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fbd895';ctx.beginPath();ctx.arc(W*.78,H*.22,W*.09,0,Math.PI*2);ctx.fill();poly([[0,horizon],[0,H*.26],[W*.14,H*.17],[W*.33,H*.30],[W*.56,H*.2],[W*.72,H*.30],[W*.91,H*.18],[W,H*.25],[W,horizon]],'#6c6197');poly([[0,horizon],[W*.2,H*.26],[W*.39,H*.33],[W*.67,H*.27],[W,H*.33],[W,H]],'#417f78');ctx.fillStyle='#34766a';ctx.fillRect(0,horizon,W,H-horizon);
for(let i=0;i<34;i++){let z=i/34,z2=(i+1)/34,a=roadPoint(1,z),b=roadPoint(1,z2),half=W*.47*z*z,half2=W*.47*z2*z2;ctx.fillStyle=(i+Math.floor(travel*13))%2?'#397f70':'#3d8775';ctx.fillRect(0,a.y,W,b.y-a.y+1);poly([[W/2-half,a.y],[W/2+half,a.y],[W/2+half2,b.y],[W/2-half2,b.y]],'#313e5e');let edge=(i+Math.floor(travel*18))%3===0?'#f26c8c':'#dfd4c5';for(let s of [-1,1])poly([[W/2+s*half,a.y],[W/2+s*(half+W*.017*z*z),a.y],[W/2+s*(half2+W*.017*z2*z2),b.y],[W/2+s*half2,b.y]],edge)}
// Continue the asphalt beneath the control panel.
poly([[W*.03,H*.91],[W*.97,H*.91],[W*1.15,H],[W*-.15,H]],'#313e5e');
for(let i=0;i<16;i++){let z=((i/16+travel*.24)%1);for(let l of [.5,1.5]){let a=roadPoint(l,z),b=roadPoint(l,Math.min(1,z+.025));poly([[a.x-W*.003*a.s,a.y],[a.x+W*.003*a.s,a.y],[b.x+W*.004*b.s,b.y],[b.x-W*.004*b.s,b.y]],'#dedcca')}}
for(let i=0;i<16;i++){let z=((i/16+travel*.13)%1),q=roadPoint(1,z);for(let side of [-1,1]){let x=W/2+side*(W*.06+W*.61*z*z),sz=W*.12*q.s;rr(x-sz*.045,q.y-sz*.15,sz*.09,sz*.4,0,'#60526a');poly([[x,q.y-sz*1.8],[x-sz*.45,q.y],[x+sz*.45,q.y]],i%2?'#277669':'#245b62')}}
traffic.slice().sort((a,b)=>a.z-b.z).forEach(c=>car(c.lane,c.z,c.color));car(px,1,'#77e9ff',true);
if(speed>350&&state==='running'){ctx.strokeStyle='#ffffff22';ctx.lineWidth=2;for(let i=0;i<10;i++){let y=(i*H/10+travel*130)%H;ctx.beginPath();ctx.moveTo(i%2?W-10:10,y);ctx.lineTo(i%2?W-15:15,y+H*.045);ctx.stroke()}}
}
function flash(t){$('toast').textContent=t;toastTime=1}
function save(){best=Math.max(best,Math.floor(score));$('best').textContent=best;try{localStorage.setItem('highway-rush-best',best)}catch(e){}}
function end(){state='over';save();$('title').textContent='Race khatam!';$('message').innerHTML='Tumhara score: <b>'+Math.floor(score)+'</b><br>Top speed: '+Math.floor(speed)+' km/h';$('start').textContent='Dobara khelo →';$('overlay').classList.remove('hidden');if(navigator.vibrate)navigator.vibrate(100)}
function togglePause(){if(state==='running'){state='paused';$('title').textContent='Race paused';$('message').textContent='Tayyar ho? Race jari rakho.';$('start').textContent='Jari rakho →';$('overlay').classList.remove('hidden')}else if(state==='paused'){state='running';$('overlay').classList.add('hidden')}}
function move(d){if(state==='running')lane=Math.max(0,Math.min(2,lane+d))}
function start(){if(state==='paused'){togglePause();return}lane=px=1;speed=180;score=elapsed=travel=0;traffic=[];spawn=.9;safeLane=1;state='running';$('overlay').classList.add('hidden');$('toast').textContent='';toastTime=0;fullscreen()}
function fullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function wave(){// At least one lane remains open in each traffic row.
let next=Math.max(0,Math.min(2,safeLane+(Math.random()<.5?-1:1)));safeLane=next;
let blocked=[0,1,2].filter(l=>l!==next);if(Math.random()>.48+elapsed*.006)blocked.splice(Math.floor(Math.random()*2),1);
blocked.forEach(l=>traffic.push({lane:l,z:.08,passed:false,color:['#ff6687','#ffd17c','#c6adff','#e6edf4'][Math.floor(Math.random()*4)]}));
spawn=Math.max(.84,1.55-elapsed*.011)}
function update(dt){if(state!=='running')return;elapsed+=dt;speed=Math.min(500,180+elapsed*5.5);travel+=dt*speed/240;score+=dt*speed*.11;px+=(lane-px)*Math.min(1,dt*15);spawn-=dt;if(spawn<=0)wave();const velocity=.20+speed/1250;for(const c of traffic){let prev=c.z;c.z+=dt*velocity;if(c.z>.92&&prev<1.075&&Math.abs(c.lane-px)<.58){end();break}if(!c.passed&&c.z>1.07){c.passed=true;if(Math.abs(c.lane-px)<1.12){score+=100;flash('NEAR MISS +100')}}}traffic=traffic.filter(c=>c.z<1.22);if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').textContent=''}$('score').textContent=Math.floor(score);$('speed').textContent=Math.floor(speed)}
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('start').onclick=start;$('pause').onclick=togglePause;$('fullscreen').onclick=fullscreen;
for(const [id,d] of [['left',-1],['right',1]])$(id).addEventListener('pointerdown',e=>{e.preventDefault();move(d)});
let touchX=null;canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(touchX!==null&&Math.abs(e.clientX-touchX)>25)move(e.clientX>touchX?1:-1);touchX=null});canvas.addEventListener('pointercancel',()=>touchX=null);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '||e.key==='Escape')togglePause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')togglePause()});
</script></body></html>
