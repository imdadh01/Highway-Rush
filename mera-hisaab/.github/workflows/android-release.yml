name: Signed Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the original signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" && test -n "$STORE_PASS"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=mera-hisaab\nkeyPassword=%s\n' "$STORE_PASS" "$STORE_PASS" > signing.properties
      - name: Build APK (no tests)
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          export APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          export APP_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          gradle --no-daemon assembleRelease -x test -x lint
          cp app/build/outputs/apk/release/app-release.apk Mera-Hisaab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mera-Hisaab-signed-apk
          path: Mera-Hisaab.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" Mera-Hisaab.apk --title "Mera Hisaab 1.0.${GITHUB_RUN_NUMBER}" --notes 'Signed Android APK. Tests were not run, as requested. Install over the existing app to keep records.'
      - name: Remove temporary signing material
        if: always()
        run: rm -f release.jks signing.properties
