name: Verify Bakra Hisab release
on:
  push:
    branches: [bakra-hisab-app]
    paths: ['bakra-hisab-dist/release-apk.base64', '.github/workflows/bakra-verify.yml', 'validation/android_smoke.py']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify signing certificate and package
        run: |
          base64 -d bakra-hisab-dist/release-apk.base64 > Bakra-Hisab.apk
          sdkmanager 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Bakra-Hisab.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Bakra-Hisab.apk | head -8
      - name: Install screen reader for UI test
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install Bakra-Hisab.apk
            adb shell am start -W -n com.bakrahisab.app/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/start.png
            adb pull /sdcard/start.png android-start.png
            base64 -w 0 android-start.png > bakra-hisab-dist/android-start.png.base64
            python3 validation/android_smoke.py
            base64 -w 0 android-screen.png > bakra-hisab-dist/android-screen.png.base64
      - uses: actions/upload-artifact@v4
        with:
          name: Bakra-Hisab-1.0.0
          path: Bakra-Hisab.apk
      - name: Save Android verification screenshot
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add bakra-hisab-dist
          git commit -m 'Save Android installation verification [skip ci]' || exit 0
          git push origin HEAD:bakra-hisab-app
