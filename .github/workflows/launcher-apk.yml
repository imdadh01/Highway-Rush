name: Build Amber Launcher APK
on:
  push:
    branches: [amber-launcher-new]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable APK only — no tests or lint
        run: gradle :app:assembleDebug -x test -x lint --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Amber-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Amber-Launcher-APK
          path: Amber-Launcher.apk
          retention-days: 90
