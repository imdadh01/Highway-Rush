name: Bakra Hisab Android
on:
  push:
    branches: [bakra-hisab-app]
    paths: ['bakra-hisab/**', '.github/workflows/bakra-hisab.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check 1.3.1 changes
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          mkdir -p tmp/app
          python3 -m http.server 8765 --directory bakra-hisab/app/src/main/assets > /tmp/hisab-server.log 2>&1 &
          node bakra-hisab/tests/update131.cjs
      - name: Build APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
          gradle -p bakra-hisab assembleRelease assembleDebug --no-daemon
      - name: Enable KVM for new notification check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check new offline health notification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 bakra-hisab/tests/health-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bakra-Hisab-unsigned
          path: bakra-hisab/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Save unsigned build for signing
        run: |
          mkdir -p bakra-hisab-dist
          base64 -w 0 bakra-hisab/app/build/outputs/apk/release/app-release-unsigned.apk > bakra-hisab-dist/unsigned-apk.base64
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          for f in tmp/app/*.png; do [ -f "$f" ] || continue; base64 -w 0 "$f" > "bakra-hisab-dist/$(basename "$f").base64"; done
          git add bakra-hisab-dist
          git commit -m 'Store unsigned Bakra Hisab build [skip ci]' || exit 0
          git push origin HEAD:bakra-hisab-app

