name: Verify signed 1.3.3 update
on:
  push:
    branches: [bakra-hisab-app]
    paths: ['bakra-hisab-dist/Bakra-Hisab-1.3.3.apk', '.github/workflows/verify-update133.yml', 'validation/update133.py']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify signatures, package and version
        run: |
          sdkmanager 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs bakra-hisab-dist/Bakra-Hisab-1.3.3.apk
          for v in 1.3.2 1.3.3; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs bakra-hisab-dist/Bakra-Hisab-$v.apk | grep 'certificate SHA-256 digest' > cert-$v.txt; done
          diff cert-1.3.2.txt cert-1.3.3.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging bakra-hisab-dist/Bakra-Hisab-1.3.3.apk | head -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 validation/update133.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bakra-Hisab-1.3.3-Signed-Verified
          path: bakra-hisab-dist/Bakra-Hisab-1.3.3.apk
