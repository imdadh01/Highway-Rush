name: Gallery Android 13 runtime test
on:
  workflow_dispatch:
  push:
    branches: [gallery/nubia-android13-tests]
    paths:
      - 'gallery-port/**'
      - '.github/workflows/gallery-android13.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Restore and verify candidate
        run: python gallery-port/restore.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Gallery installation and interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 720x1280
          script: python gallery-port/tests/smoke.py gallery-port/Gallery-Nubia.apk
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android13-test-results
          path: test-results
          retention-days: 7
      - name: Publish tested APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Nubia-Android13-tested
          path: gallery-port/Gallery-Nubia.apk
          retention-days: 7
