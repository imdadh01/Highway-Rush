name: Gallery Android 13 DEX loading check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dex-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install bsdiff4
      - name: Restore and verify candidate
        run: python gallery-port/restore.py
      - name: Validate all DEX method declarations
        run: |
          mkdir -p test-results
          python gallery-port/tests/verify_dex_layout.py gallery-port/Gallery-Nubia.apk --json test-results/dex-layout.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load Gallery code in Android 13 ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python gallery-port/tests/art_verify.py gallery-port/Gallery-Nubia.apk
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android13-dex-results
          path: test-results
          retention-days: 7
      - name: Publish APK with DEX loading checked
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Nubia-v4-DEX-checked
          path: gallery-port/Gallery-Nubia.apk
          retention-days: 7
